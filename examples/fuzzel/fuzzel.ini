# Fuzzel — lansator + dmenu pentru power-menu și clip-menu. Strict monocrom, colțuri drepte.
font=Adwaita Sans:size=12
prompt="> "
placeholder=caută…
icons-enabled=no
width=40
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=24
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes
terminal=alacritty -e

# Elementul selectat = inversat (negru pe alb). Potrivirile = alb.
[colors]
background=141414f5
text=ccccccff
prompt=999999ff
placeholder=555555ff
input=ffffffff
match=ffffffff
selection=f5f5f5ff
selection-text=080808ff
selection-match=080808ff
border=292929ff
counter=999999ff

[border]
width=1
radius=0
